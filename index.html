<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Space Loader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; }
    canvas { position: fixed; inset: 0; }
    #ui {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 10;
    }
    #card {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: clamp(20px,4vw,36px) clamp(28px,6vw,52px);
      background: rgba(5,0,20,0.5);
      border: 1px solid rgba(160,120,255,0.15);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(100,60,255,0.12), 0 20px 60px rgba(0,0,0,0.8),
                  inset 0 1px 0 rgba(255,255,255,0.08);
    }
    #logo {
      width: clamp(54px,10vw,72px);
      filter: drop-shadow(0 0 18px rgba(191,150,115,1)) drop-shadow(0 0 40px rgba(191,150,115,0.4));
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-9px) scale(1.03); }
    }
    #dots { display: flex; gap: 7px; }
    .dot {
      width: 5px; height: 5px; border-radius: 50%;
      animation: dp 1.6s ease-in-out infinite;
    }
    .dot:nth-child(1){ background:#BF9673; }
    .dot:nth-child(2){ background:#9b7aff; animation-delay:.22s; }
    .dot:nth-child(3){ background:#5ab4ff; animation-delay:.44s; }
    @keyframes dp {
      0%,80%,100%{ transform:scale(1); opacity:.35; }
      40%        { transform:scale(1.7); opacity:1; }
    }
    #lbl {
      font: 300 clamp(8px,1.8vw,10px)/1 'Helvetica Neue',Arial,sans-serif;
      letter-spacing: 6px; text-transform: uppercase;
      color: rgba(180,160,255,0.35);
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="card">
    <img id="logo" src="logo.png" alt="">
    <div id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div id="lbl">loading</div>
  </div>
</div>
<script>
(function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W, H, t = 0;

  function resize(){
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    initNebula();
  }
  window.addEventListener('resize', resize);

  // ── Stars ──────────────────────────────────────────────────────────────
  const stars = Array.from({length: 300}, () => ({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.4,
    a: 0.1 + Math.random() * 0.9,
    ph: Math.random() * Math.PI * 2,
    sp: 0.003 + Math.random() * 0.015,
    color: ['255,255,255','200,210,255','255,240,200','180,220,255'][Math.floor(Math.random()*4)]
  }));

  // ── Shooting stars ─────────────────────────────────────────────────────
  const shoots = [];
  function mkShoot(){
    return {
      x: Math.random(), y: Math.random() * 0.6,
      len: 0.06 + Math.random() * 0.1,
      spd: 0.008 + Math.random() * 0.012,
      a: 0.8 + Math.random() * 0.2,
      life: 0, maxLife: 60 + Math.random() * 40,
      angle: Math.PI / 6 + Math.random() * Math.PI / 8
    };
  }

  // ── Nebula layers (offscreen canvas) ──────────────────────────────────
  let nebulaCanvas, nebulaCtx;
  function initNebula(){
    nebulaCanvas = document.createElement('canvas');
    nebulaCanvas.width = W; nebulaCanvas.height = H;
    nebulaCtx = nebulaCanvas.getContext('2d');
    drawNebula();
  }
  function drawNebula(){
    nebulaCtx.clearRect(0,0,W,H);
    const blobs = [
      { x:0.2, y:0.35, r:0.28, c:'80,40,180', a:0.18 },
      { x:0.75, y:0.25, r:0.22, c:'20,80,200', a:0.15 },
      { x:0.5, y:0.6, r:0.32, c:'140,20,120', a:0.12 },
      { x:0.85, y:0.65, r:0.18, c:'0,120,180', a:0.10 },
      { x:0.1, y:0.7, r:0.20, c:'60,0,140', a:0.13 },
    ];
    blobs.forEach(b => {
      const gx = b.x*W, gy = b.y*H, gr = b.r*Math.min(W,H);
      const g = nebulaCtx.createRadialGradient(gx,gy,0,gx,gy,gr);
      g.addColorStop(0, `rgba(${b.c},${b.a})`);
      g.addColorStop(0.4, `rgba(${b.c},${b.a*0.5})`);
      g.addColorStop(1, `rgba(${b.c},0)`);
      nebulaCtx.fillStyle = g;
      nebulaCtx.beginPath(); nebulaCtx.arc(gx,gy,gr,0,Math.PI*2); nebulaCtx.fill();
    });
  }

  // ── Planets ────────────────────────────────────────────────────────────
  const planets = [
    { x:0.12, y:0.18, r:22, color:'#3a2060', ring:true, ringColor:'rgba(160,120,255,0.3)', tilt:0.4 },
    { x:0.88, y:0.72, r:14, color:'#1a3050', ring:false },
    { x:0.65, y:0.08, r:8,  color:'#402010', ring:false },
  ];

  // ── Particle streams ───────────────────────────────────────────────────
  const particles = Array.from({length: 120}, () => mkParticle(true));
  function mkParticle(init){
    const angle = Math.random() * Math.PI * 2;
    const dist = 0.15 + Math.random() * 0.35;
    return {
      angle, dist,
      spd: (0.002 + Math.random() * 0.004) * (Math.random()<0.5?1:-1),
      r: 0.5 + Math.random() * 1.5,
      a: 0.1 + Math.random() * 0.6,
      color: ['191,150,115','155,122,255','90,180,255','255,200,100'][Math.floor(Math.random()*4)],
      ph: Math.random() * Math.PI * 2,
      psp: 0.02 + Math.random() * 0.04,
      y: init ? Math.random() : 0
    };
  }

  function drawPlanet(p, s){
    const px = p.x*W, py = p.y*H, pr = p.r*s;
    // Glow
    const glow = ctx.createRadialGradient(px,py,pr*0.5,px,py,pr*3);
    glow.addColorStop(0, 'rgba(100,60,200,0.15)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(px,py,pr*3,0,Math.PI*2); ctx.fill();
    // Body
    const body = ctx.createRadialGradient(px-pr*0.3,py-pr*0.3,0,px,py,pr);
    body.addColorStop(0, lighten(p.color, 40));
    body.addColorStop(0.6, p.color);
    body.addColorStop(1, darken(p.color, 40));
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill();
    // Ring
    if(p.ring){
      ctx.save(); ctx.translate(px,py); ctx.scale(1, Math.sin(p.tilt));
      ctx.beginPath(); ctx.arc(0,0,pr*2.2,0,Math.PI*2);
      ctx.strokeStyle = p.ringColor; ctx.lineWidth = pr*0.35; ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,pr*1.7,0,Math.PI*2);
      ctx.strokeStyle = 'rgba(120,80,220,0.15)'; ctx.lineWidth = pr*0.2; ctx.stroke();
      ctx.restore();
    }
    // Atmosphere
    const atm = ctx.createRadialGradient(px,py,pr*0.85,px,py,pr*1.15);
    atm.addColorStop(0,'rgba(0,0,0,0)');
    atm.addColorStop(1,'rgba(80,40,180,0.2)');
    ctx.fillStyle=atm; ctx.beginPath(); ctx.arc(px,py,pr*1.15,0,Math.PI*2); ctx.fill();
  }

  function lighten(hex, amt){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
  }
  function darken(hex, amt){
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return `rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;
  }

  // ── Wormhole / vortex in center ────────────────────────────────────────
  function drawVortex(cx, cy, s){
    for(let i = 5; i >= 1; i--){
      const r = i * 18 * s;
      const a = (6-i) * 0.04;
      const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0, `rgba(60,20,120,${a*1.5})`);
      g.addColorStop(0.5, `rgba(40,10,100,${a})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    }
    // Spiral arms
    ctx.save(); ctx.translate(cx,cy);
    for(let arm=0; arm<3; arm++){
      ctx.rotate(Math.PI*2/3);
      ctx.beginPath();
      for(let r=2*s; r<60*s; r+=1){
        const angle = r*0.15 + t*0.8;
        const x = Math.cos(angle)*r, y = Math.sin(angle)*r;
        if(r===2*s) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.strokeStyle=`rgba(140,80,255,${0.08+Math.sin(t+arm)*0.04})`;
      ctx.lineWidth=1.5*s; ctx.stroke();
    }
    ctx.restore();
  }

  resize();

  function loop(){
    ctx.clearRect(0,0,W,H);
    t += 0.012;
    const s = Math.min(W,H)/700;
    const cx = W/2, cy = H/2;

    // Background
    ctx.fillStyle = '#000005'; ctx.fillRect(0,0,W,H);

    // Nebula
    ctx.globalAlpha = 0.7 + Math.sin(t*0.3)*0.1;
    ctx.drawImage(nebulaCanvas,0,0);
    ctx.globalAlpha = 1;

    // Stars
    stars.forEach(st => {
      st.ph += st.sp;
      const a = st.a * (0.4 + Math.sin(st.ph)*0.6);
      ctx.beginPath(); ctx.arc(st.x*W, st.y*H, st.r*s, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${st.color},${a})`; ctx.fill();
    });

    // Shooting stars
    if(Math.random() < 0.008) shoots.push(mkShoot());
    for(let i = shoots.length-1; i>=0; i--){
      const sh = shoots[i];
      sh.life++;
      if(sh.life > sh.maxLife){ shoots.splice(i,1); continue; }
      const prog = sh.life / sh.maxLife;
      const alpha = sh.a * Math.sin(prog * Math.PI);
      const x = sh.x*W + Math.cos(sh.angle)*sh.spd*sh.life*W;
      const y = sh.y*H + Math.sin(sh.angle)*sh.spd*sh.life*H;
      const tailX = x - Math.cos(sh.angle)*sh.len*W;
      const tailY = y - Math.sin(sh.angle)*sh.len*H;
      const sg = ctx.createLinearGradient(tailX,tailY,x,y);
      sg.addColorStop(0,'rgba(255,255,255,0)');
      sg.addColorStop(1,`rgba(255,255,255,${alpha})`);
      ctx.strokeStyle=sg; ctx.lineWidth=1.5*s;
      ctx.beginPath(); ctx.moveTo(tailX,tailY); ctx.lineTo(x,y); ctx.stroke();
    }

    // Planets
    planets.forEach(p => drawPlanet(p, s));

    // Vortex
    drawVortex(cx, cy, s);

    // Particles orbiting center
    particles.forEach(p => {
      p.angle += p.spd;
      p.ph += p.psp;
      const a = p.a * (0.5 + Math.sin(p.ph)*0.5);
      const px = cx + Math.cos(p.angle) * p.dist * Math.min(W,H) * 0.5;
      const py = cy + Math.sin(p.angle) * p.dist * Math.min(W,H) * 0.25;
      ctx.beginPath(); ctx.arc(px, py, p.r*s, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.color},${a})`; ctx.fill();
    });

    // Milky way band
    const mw = ctx.createLinearGradient(0,H*0.1,W,H*0.9);
    mw.addColorStop(0,'rgba(0,0,0,0)');
    mw.addColorStop(0.3,'rgba(80,60,120,0.04)');
    mw.addColorStop(0.5,'rgba(100,80,160,0.07)');
    mw.addColorStop(0.7,'rgba(80,60,120,0.04)');
    mw.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=mw; ctx.fillRect(0,0,W,H);

    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
