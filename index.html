<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Ocean Loader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020e1c;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; overflow: hidden;
    }
    canvas { position: fixed; inset: 0; }

    #ui {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none; z-index: 10;
      gap: 0;
    }

    /* Frosted glass card */
    #card {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: clamp(24px, 5vw, 40px) clamp(32px, 7vw, 60px);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 8px 40px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 0 60px rgba(0,100,200,0.08);
      gap: 20px;
    }

    #logo {
      width: clamp(56px, 11vw, 76px);
      filter:
        drop-shadow(0 0 16px rgba(191,150,115,0.85))
        drop-shadow(0 4px 12px rgba(0,0,0,0.6));
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0px) rotate(-1deg); }
      50%      { transform: translateY(-8px) rotate(1deg); }
    }

    #dots {
      display: flex; gap: 8px; align-items: center;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(1){ background: #BF9673; animation-delay: 0s; }
    .dot:nth-child(2){ background: rgba(191,150,115,0.6); animation-delay: 0.2s; }
    .dot:nth-child(3){ background: rgba(191,150,115,0.35); animation-delay: 0.4s; }
    @keyframes dotPulse {
      0%,80%,100% { transform: scale(1); opacity: 0.5; }
      40%          { transform: scale(1.5); opacity: 1; }
    }

    #label {
      font-family: 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(180,220,255,0.35);
    }

    /* Wave progress bar */
    #bar-wrap {
      width: clamp(100px, 20vw, 150px);
      height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    #bar {
      height: 100%;
      background: linear-gradient(90deg, #263466, #BF9673, #5ab4ff);
      border-radius: 3px;
      animation: barAnim 3s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(90,180,255,0.6);
    }
    @keyframes barAnim {
      0%   { width: 0%;   opacity: 1; }
      75%  { width: 100%; opacity: 1; }
      90%  { width: 100%; opacity: 0; }
      91%  { width: 0%;   opacity: 0; }
      100% { width: 0%;   opacity: 1; }
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="card">
    <img id="logo" src="logo.png" alt="logo" />
    <div id="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="label">loading</div>
  </div>
</div>

<script>
(function(){
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  let W, H, CX, CY, sc;
  let t = 0;

  function resize(){
    W = c.width = window.innerWidth;
    H = c.height = window.innerHeight;
    CX = W/2; CY = H/2;
    sc = Math.min(W,H)/700;
  }
  resize();
  window.addEventListener('resize', resize);

  // ── Waves (3 clean layers) ────────────────────────────────────────────────
  const waves = [
    { amp: 38, freq: 0.008, spd: 1.1, yFrac: 0.62, color: [0,50,110],   a: 0.9 },
    { amp: 28, freq: 0.012, spd: 1.6, yFrac: 0.66, color: [0,70,140],   a: 0.7 },
    { amp: 18, freq: 0.018, spd: 2.2, yFrac: 0.70, color: [10,100,180], a: 0.5 },
  ];

  // ── Foam particles on wave crests ─────────────────────────────────────────
  const foam = Array.from({length: 35}, () => ({
    x: Math.random() * 1,
    phase: Math.random() * Math.PI * 2,
    size: (1 + Math.random() * 2.5) * sc,
    alpha: 0.2 + Math.random() * 0.5,
    speed: 0.008 + Math.random() * 0.012
  }));

  // ── Underwater glow orbs ──────────────────────────────────────────────────
  const orbs = Array.from({length: 5}, (_, i) => ({
    x: 0.1 + (i/4)*0.8,
    y: 0.72 + Math.random()*0.2,
    r: (40 + Math.random()*60)*sc,
    phase: Math.random()*Math.PI*2,
    spd: 0.005 + Math.random()*0.008,
    col: i%2===0 ? [0,120,220] : [0,80,160]
  }));

  // ── Bubbles ───────────────────────────────────────────────────────────────
  const bubbles = Array.from({length: 25}, () => mkBubble(true));
  function mkBubble(init){
    return {
      x: Math.random(),
      y: init ? Math.random()*0.4 + 0.6 : 1.05,
      r: (1 + Math.random()*3)*sc,
      spd: 0.0006 + Math.random()*0.001,
      wobble: Math.random()*Math.PI*2,
      wSpd: 0.02 + Math.random()*0.03,
      a: 0.15 + Math.random()*0.3
    };
  }

  // ── Light rays ────────────────────────────────────────────────────────────
  const rays = Array.from({length: 5}, (_, i) => ({
    x: 0.2 + (i/4)*0.6,
    w: 0.012 + Math.random()*0.02,
    a: 0.025 + Math.random()*0.04,
    phase: Math.random()*Math.PI*2,
    spd: 0.003 + Math.random()*0.004
  }));

  // ── Stars / sky ───────────────────────────────────────────────────────────
  const stars = Array.from({length: 80}, () => ({
    x: Math.random(), y: Math.random()*0.55,
    r: 0.3 + Math.random()*0.9,
    a: 0.1 + Math.random()*0.5,
    phase: Math.random()*Math.PI*2,
    spd: 0.01 + Math.random()*0.02
  }));

  function getWaveY(wave, x, time){
    return wave.yFrac * H
      + Math.sin(x * wave.freq + time * wave.spd) * wave.amp * sc
      + Math.sin(x * wave.freq * 1.8 - time * wave.spd * 0.7) * wave.amp * 0.35 * sc;
  }

  function loop(){
    ctx.clearRect(0,0,W,H);
    t += 0.016;

    // ── Sky gradient ──────────────────────────────────────────────────────
    const sky = ctx.createLinearGradient(0,0,0,H*0.65);
    sky.addColorStop(0,   '#010810');
    sky.addColorStop(0.5, '#021220');
    sky.addColorStop(1,   '#031a30');
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H*0.65);

    // ── Stars ─────────────────────────────────────────────────────────────
    stars.forEach(s => {
      s.phase += s.spd;
      const a = s.a * (0.5 + Math.sin(s.phase)*0.5);
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r*sc, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,230,255,${a})`; ctx.fill();
    });

    // ── Horizon glow ──────────────────────────────────────────────────────
    const hg = ctx.createRadialGradient(CX, H*0.62, 0, CX, H*0.62, W*0.6);
    hg.addColorStop(0,   'rgba(0,120,220,0.18)');
    hg.addColorStop(0.4, 'rgba(0,60,140,0.08)');
    hg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = hg; ctx.fillRect(0,0,W,H);

    // ── Moon reflection ───────────────────────────────────────────────────
    const moonX = W*0.72, moonY = H*0.18;
    // Moon
    const moonG = ctx.createRadialGradient(moonX,moonY,0,moonX,moonY,22*sc);
    moonG.addColorStop(0,   'rgba(240,240,220,0.95)');
    moonG.addColorStop(0.6, 'rgba(200,210,180,0.5)');
    moonG.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = moonG; ctx.beginPath(); ctx.arc(moonX,moonY,22*sc,0,Math.PI*2); ctx.fill();
    // Moon halo
    const halo = ctx.createRadialGradient(moonX,moonY,18*sc,moonX,moonY,70*sc);
    halo.addColorStop(0, 'rgba(200,220,255,0.08)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(moonX,moonY,70*sc,0,Math.PI*2); ctx.fill();
    // Reflection on water
    const refG = ctx.createLinearGradient(moonX,H*0.6,moonX,H);
    refG.addColorStop(0, 'rgba(200,220,255,0.18)');
    refG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = refG;
    ctx.fillRect(moonX - 18*sc, H*0.6, 36*sc, H*0.4);

    // ── Light rays underwater ─────────────────────────────────────────────
    rays.forEach(r => {
      r.phase += r.spd;
      const a = r.a * (0.6 + Math.sin(r.phase)*0.4);
      const x0 = r.x * W;
      const rg = ctx.createLinearGradient(x0, H*0.62, x0 + 30*sc, H);
      rg.addColorStop(0, `rgba(100,200,255,${a})`);
      rg.addColorStop(1, `rgba(0,60,140,0)`);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x0 - r.w*W, H*0.62);
      ctx.lineTo(x0 + r.w*W, H*0.62);
      ctx.lineTo(x0 + r.w*W + 20*sc, H);
      ctx.lineTo(x0 - r.w*W + 20*sc, H);
      ctx.closePath();
      ctx.fillStyle = rg; ctx.fill();
      ctx.restore();
    });

    // ── Underwater body ───────────────────────────────────────────────────
    const sea = ctx.createLinearGradient(0, H*0.62, 0, H);
    sea.addColorStop(0,   '#042040');
    sea.addColorStop(0.4, '#031830');
    sea.addColorStop(1,   '#010c1a');
    ctx.fillStyle = sea; ctx.fillRect(0, H*0.62, W, H*0.38);

    // ── Glow orbs ─────────────────────────────────────────────────────────
    orbs.forEach(o => {
      o.phase += o.spd;
      const pulse = 0.7 + Math.sin(o.phase)*0.3;
      const og = ctx.createRadialGradient(o.x*W, o.y*H, 0, o.x*W, o.y*H, o.r*pulse);
      og.addColorStop(0, `rgba(${o.col[0]},${o.col[1]},${o.col[2]},0.12)`);
      og.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = og; ctx.beginPath(); ctx.arc(o.x*W,o.y*H,o.r*pulse,0,Math.PI*2); ctx.fill();
    });

    // ── Bubbles ───────────────────────────────────────────────────────────
    bubbles.forEach((b,i) => {
      b.y -= b.spd; b.wobble += b.wSpd;
      b.x += Math.sin(b.wobble)*0.0005;
      if(b.y < 0.58) bubbles[i] = mkBubble(false);
      ctx.beginPath(); ctx.arc(b.x*W, b.y*H, b.r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(150,210,255,${b.a})`; ctx.lineWidth = 0.8; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x*W - b.r*0.3, b.y*H - b.r*0.3, b.r*0.25, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${b.a*0.5})`; ctx.fill();
    });

    // ── Wave layers ───────────────────────────────────────────────────────
    waves.forEach(w => {
      ctx.beginPath(); ctx.moveTo(0, H);
      for(let x=0; x<=W; x+=4){
        ctx.lineTo(x, getWaveY(w, x, t));
      }
      ctx.lineTo(W,H); ctx.closePath();
      ctx.fillStyle = `rgba(${w.color[0]},${w.color[1]},${w.color[2]},${w.a})`;
      ctx.fill();
    });

    // ── Foam on top wave ──────────────────────────────────────────────────
    foam.forEach(f => {
      f.phase += f.speed;
      const wy = getWaveY(waves[0], f.x*W, t);
      const a = f.alpha * (0.5 + Math.sin(f.phase)*0.5);
      ctx.beginPath(); ctx.arc(f.x*W, wy - 1*sc, f.size, 0, Math.PI*2);
      ctx.fillStyle = `rgba(220,240,255,${a})`; ctx.fill();
    });

    // ── Surface shimmer ───────────────────────────────────────────────────
    for(let i=0; i<8; i++){
      const sx = ((Math.sin(t*0.9+i*0.8)*0.3+0.5))*W;
      const wy = getWaveY(waves[0], sx, t);
      const sw = (15+Math.sin(t+i)*8)*sc;
      const sg = ctx.createLinearGradient(sx-sw,wy,sx+sw,wy);
      sg.addColorStop(0,'rgba(255,255,255,0)');
      sg.addColorStop(0.5,`rgba(255,255,255,${0.08+Math.sin(t*1.5+i)*0.04})`);
      sg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = sg; ctx.fillRect(sx-sw, wy-2*sc, sw*2, 4*sc);
    }

    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
