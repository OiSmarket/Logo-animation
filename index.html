<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photorealistic Ocean</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    #ui {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none; z-index: 10;
    }
    #card {
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      padding: clamp(20px,4vw,36px) clamp(28px,6vw,52px);
      background: rgba(2,14,30,0.45);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    #logo {
      width: clamp(54px,10vw,72px);
      filter: drop-shadow(0 0 14px rgba(191,150,115,0.9)) drop-shadow(0 3px 10px rgba(0,0,0,0.8));
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0) rotate(-1.5deg); }
      50%      { transform: translateY(-7px) rotate(1.5deg); }
    }
    #dots { display: flex; gap: 7px; }
    .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(191,150,115,0.7);
      animation: dp 1.5s ease-in-out infinite;
    }
    .dot:nth-child(2){ animation-delay:.2s; }
    .dot:nth-child(3){ animation-delay:.4s; }
    @keyframes dp {
      0%,80%,100%{ transform:scale(1); opacity:.4; }
      40%        { transform:scale(1.6); opacity:1; }
    }
    #lbl {
      font: 400 clamp(8px,1.8vw,10px)/1 'Helvetica Neue',Arial,sans-serif;
      letter-spacing: 5px; text-transform: uppercase;
      color: rgba(160,210,255,0.3);
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="card">
    <img id="logo" src="logo.png" alt="">
    <div id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div id="lbl">loading</div>
  </div>
</div>
<script>
(function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W,H,t=0;

  function resize(){
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
  }
  resize(); window.addEventListener('resize', resize);

  const sc = () => Math.min(W,H)/700;

  /* ── Perlin-like noise (simple) ─────────────────────────────────────── */
  function noise(x,y,t){
    return Math.sin(x*1.3+t)*Math.cos(y*0.9-t*0.7)
          +Math.sin(x*2.7-t*1.1)*Math.cos(y*2.1+t*0.5)*0.5
          +Math.sin(x*5.1+t*0.8)*Math.cos(y*4.3-t*1.3)*0.25;
  }

  /* ── Stars ──────────────────────────────────────────────────────────── */
  const stars = Array.from({length:120},()=>({
    x:Math.random(), y:Math.random()*0.48,
    r:0.3+Math.random()*1.1, a:0.1+Math.random()*0.7,
    ph:Math.random()*Math.PI*2, sp:0.005+Math.random()*0.02
  }));

  /* ── Moon ───────────────────────────────────────────────────────────── */
  const moon = { x:0.75, y:0.14, r:26 };

  /* ── Clouds ─────────────────────────────────────────────────────────── */
  const clouds = Array.from({length:6},(_,i)=>({
    x:Math.random(), y:0.08+Math.random()*0.28,
    w:(120+Math.random()*180), h:(28+Math.random()*40),
    spd:0.00008+Math.random()*0.00012,
    a:0.04+Math.random()*0.09
  }));

  /* ── Ocean surface grid (vertex displacement) ───────────────────────── */
  const COLS = 80, ROWS = 30;

  /* ── Foam streaks ───────────────────────────────────────────────────── */
  const foamStreaks = Array.from({length:22},()=>({
    x:Math.random(), y:0, len:0.04+Math.random()*0.1,
    a:0.15+Math.random()*0.35, ph:Math.random()*Math.PI*2,
    sp:0.006+Math.random()*0.01
  }));

  /* ── Bubbles ────────────────────────────────────────────────────────── */
  const bubbles = Array.from({length:18},()=>mkB(true));
  function mkB(init){
    return { x:Math.random(), y:init?0.65+Math.random()*0.35:1.02,
      r:(1+Math.random()*3), spd:0.0005+Math.random()*0.001,
      wb:Math.random()*Math.PI*2, ws:0.02+Math.random()*0.03, a:0.1+Math.random()*0.3 };
  }

  /* ── Underwater caustics ────────────────────────────────────────────── */
  const caustics = Array.from({length:14},()=>({
    x:Math.random(), y:0.72+Math.random()*0.25,
    r:(12+Math.random()*28), ph:Math.random()*Math.PI*2,
    sp:0.007+Math.random()*0.01, a:0.03+Math.random()*0.06
  }));

  /* ── Horizon water line ─────────────────────────────────────────────── */
  const HY = () => H * 0.52;

  /* ── Get displaced ocean vertex ─────────────────────────────────────── */
  function oceanY(x, row, time){
    const frac = row / ROWS;
    const depth = frac * frac; // perspective
    const amp = (1-depth) * 42 * sc() + depth * 8 * sc();
    const freq = 0.006 + depth * 0.01;
    return HY() + frac*(H - HY())
      + Math.sin(x*freq + time*1.2) * amp
      + Math.sin(x*freq*1.9 - time*0.8) * amp*0.4
      + Math.sin(x*freq*3.1 + time*1.7) * amp*0.2
      + noise(x*0.003, frac*2, time*0.4) * amp*0.3;
  }

  /* ── Draw ocean mesh with normals-based shading ─────────────────────── */
  function drawOcean(time){
    const colW = W / COLS;

    for(let row = 0; row < ROWS; row++){
      const frac = row/ROWS;
      const nextFrac = (row+1)/ROWS;

      // Depth-based color
      const r = Math.round(0  + frac*4);
      const g = Math.round(30 + frac*20);
      const b = Math.round(80 + frac*40);

      for(let col = 0; col < COLS; col++){
        const x0 = col*colW, x1 = (col+1)*colW;
        const y00 = oceanY(x0, row,   time);
        const y10 = oceanY(x1, row,   time);
        const y01 = oceanY(x0, row+1, time);
        const y11 = oceanY(x1, row+1, time);

        // Normal-based brightness (cross product approximation)
        const dx = y10 - y00;
        const dy = colW;
        const bright = Math.max(0, Math.min(1, 0.5 - dx/dy * 1.5));

        // Specular highlight (moon reflection)
        const mx = moon.x * W;
        const midX = (x0+x1)/2, midY = (y00+y10)/2;
        const dist = Math.hypot(midX-mx, midY-moon.y*H);
        const spec = Math.max(0, 1 - dist/(W*0.35)) * 0.35 * (1-frac);

        const alpha = 0.85 + frac*0.15;
        const rr = Math.min(255, r + bright*40 + spec*120);
        const gg = Math.min(255, g + bright*60 + spec*140);
        const bb = Math.min(255, b + bright*80 + spec*160);

        ctx.beginPath();
        ctx.moveTo(x0,y00); ctx.lineTo(x1,y10);
        ctx.lineTo(x1,y11); ctx.lineTo(x0,y01);
        ctx.closePath();
        ctx.fillStyle = `rgba(${Math.round(rr)},${Math.round(gg)},${Math.round(bb)},${alpha})`;
        ctx.fill();
      }
    }
  }

  /* ── Draw sky ───────────────────────────────────────────────────────── */
  function drawSky(){
    const g = ctx.createLinearGradient(0,0,0,HY());
    g.addColorStop(0,   '#000508');
    g.addColorStop(0.4, '#010d1c');
    g.addColorStop(0.8, '#021830');
    g.addColorStop(1,   '#031f3c');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,HY()+2);
  }

  /* ── Draw moon ──────────────────────────────────────────────────────── */
  function drawMoon(){
    const mx = moon.x*W, my = moon.y*H, mr = moon.r*sc();
    // Outer atmospheric glow
    const atm = ctx.createRadialGradient(mx,my,mr*0.8,mx,my,mr*5);
    atm.addColorStop(0,'rgba(200,220,255,0.12)');
    atm.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=atm; ctx.beginPath(); ctx.arc(mx,my,mr*5,0,Math.PI*2); ctx.fill();
    // Moon body
    const mg = ctx.createRadialGradient(mx-mr*0.2,my-mr*0.2,0,mx,my,mr);
    mg.addColorStop(0,'rgba(255,255,240,1)');
    mg.addColorStop(0.5,'rgba(230,235,210,0.95)');
    mg.addColorStop(1,'rgba(180,190,160,0.6)');
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();
    // Craters
    [[-0.3,0.2,0.18],[-0.25,0.35,0.12],[0.1,-0.3,0.09]].forEach(([cx,cy,cr])=>{
      ctx.beginPath(); ctx.arc(mx+cx*mr,my+cy*mr,cr*mr,0,Math.PI*2);
      ctx.fillStyle='rgba(160,170,140,0.25)'; ctx.fill();
    });
    // Water reflection column
    const refW = mr*2.5;
    const refG = ctx.createLinearGradient(mx,HY(),mx,H);
    refG.addColorStop(0,'rgba(220,235,255,0.22)');
    refG.addColorStop(0.3,'rgba(180,210,255,0.1)');
    refG.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save();
    ctx.beginPath();
    // Wavy reflection column
    ctx.moveTo(mx-refW,HY());
    for(let y=HY(); y<H; y+=4){
      const frac=(y-HY())/(H-HY());
      const ww=refW*(1+frac*1.5);
      const wx=Math.sin(y*0.04+t*1.5)*ww*0.3;
      ctx.lineTo(mx+wx+ww,y);
    }
    for(let y=H; y>=HY(); y-=4){
      const frac=(y-HY())/(H-HY());
      const ww=refW*(1+frac*1.5);
      const wx=Math.sin(y*0.04+t*1.5)*ww*0.3;
      ctx.lineTo(mx+wx-ww,y);
    }
    ctx.closePath();
    ctx.fillStyle=refG; ctx.fill();
    ctx.restore();
  }

  /* ── Draw clouds ────────────────────────────────────────────────────── */
  function drawClouds(){
    clouds.forEach(cl=>{
      cl.x += cl.spd;
      if(cl.x > 1.2) cl.x = -0.2;
      const cx=cl.x*W, cy=cl.y*H;
      // Multi-blob cloud
      for(let i=0;i<5;i++){
        const bx=cx+(i-2)*cl.w*0.18, by=cy+Math.sin(i*1.2)*cl.h*0.3;
        const br=cl.h*(0.5+Math.sin(i*0.9)*0.2);
        const bg=ctx.createRadialGradient(bx,by-br*0.2,0,bx,by,br);
        bg.addColorStop(0,`rgba(180,200,230,${cl.a*1.2})`);
        bg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
      }
    });
  }

  function loop(){
    ctx.clearRect(0,0,W,H);
    t += 0.012;
    const s = sc();

    drawSky();

    // Stars
    stars.forEach(st=>{
      st.ph+=st.sp;
      const a=st.a*(0.4+Math.sin(st.ph)*0.6);
      ctx.beginPath(); ctx.arc(st.x*W,st.y*H,st.r*s,0,Math.PI*2);
      ctx.fillStyle=`rgba(210,230,255,${a})`; ctx.fill();
    });

    drawMoon();
    drawClouds();
    drawOcean(t);

    // Caustics
    caustics.forEach(ca=>{
      ca.ph+=ca.sp;
      const pulse=0.7+Math.sin(ca.ph)*0.3;
      const cg=ctx.createRadialGradient(ca.x*W,ca.y*H,0,ca.x*W,ca.y*H,ca.r*s*pulse);
      cg.addColorStop(0,`rgba(80,180,255,${ca.a})`);
      cg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(ca.x*W,ca.y*H,ca.r*s*pulse,0,Math.PI*2); ctx.fill();
    });

    // Foam streaks on surface
    foamStreaks.forEach(f=>{
      f.ph+=f.sp;
      f.y = (oceanY(f.x*W, 0, t) / H);
      const a=f.a*(0.4+Math.sin(f.ph)*0.6);
      const x0=f.x*W, x1=(f.x+f.len)*W;
      const fg=ctx.createLinearGradient(x0,0,x1,0);
      fg.addColorStop(0,'rgba(255,255,255,0)');
      fg.addColorStop(0.3,`rgba(255,255,255,${a})`);
      fg.addColorStop(0.7,`rgba(255,255,255,${a*0.6})`);
      fg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=fg; ctx.lineWidth=1.2*s;
      ctx.beginPath(); ctx.moveTo(x0,f.y*H); ctx.lineTo(x1,f.y*H); ctx.stroke();
    });

    // Bubbles
    bubbles.forEach((b,i)=>{
      b.y-=b.spd; b.wb+=b.ws; b.x+=Math.sin(b.wb)*0.0004;
      if(b.y<0.5) bubbles[i]=mkB(false);
      ctx.beginPath(); ctx.arc(b.x*W,b.y*H,b.r*s,0,Math.PI*2);
      ctx.strokeStyle=`rgba(160,220,255,${b.a})`; ctx.lineWidth=0.7; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x*W-b.r*s*0.3,b.y*H-b.r*s*0.3,b.r*s*0.22,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${b.a*0.5})`; ctx.fill();
    });

    // Deep water fade
    const deep=ctx.createLinearGradient(0,H*0.8,0,H);
    deep.addColorStop(0,'rgba(0,0,0,0)');
    deep.addColorStop(1,'rgba(0,5,12,0.75)');
    ctx.fillStyle=deep; ctx.fillRect(0,H*0.8,W,H*0.2);

    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
