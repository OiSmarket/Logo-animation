<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Premium Loader v2</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080810;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    .ui {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      pointer-events: none;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(191,150,115,0.5);
      animation: fadeUp 1s ease both;
    }
    .brand {
      font-size: 58px;
      font-weight: 300;
      color: #fff;
      letter-spacing: 12px;
      text-transform: uppercase;
      animation: fadeUp 1.2s ease both;
    }
    .brand em {
      font-style: normal;
      color: #BF9673;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeUp 1.4s ease both;
    }
    .divider-line {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #BF9673);
      animation: growLine 1.8s 0.6s ease forwards;
    }
    .divider-line.right {
      background: linear-gradient(90deg, #BF9673, transparent);
    }
    .divider-diamond {
      width: 5px; height: 5px;
      background: #C7212C;
      transform: rotate(45deg);
      box-shadow: 0 0 8px #C7212C;
    }
    @keyframes growLine { to { width: 80px; } }
    .sub {
      font-size: 12px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      animation: fadeUp 1.6s ease both;
    }
    .status {
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(191,150,115,0.4);
      text-transform: uppercase;
      animation: fadeUp 1.8s ease both, pulse 2.5s 2s ease-in-out infinite;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%,100% { opacity: 0.4; }
      50%      { opacity: 0.9; }
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="eyebrow">Легализация в Польше</div>
  <div class="brand">AVI<em>N</em>O</div>
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line right"></div>
  </div>
  <div class="sub">Польша · Украина · Документы</div>
  <div class="status">Загрузка...</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, CX, CY;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2;
}
resize();
window.addEventListener('resize', resize);

let mx = -1, my = -1;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });

// ── Aurora bands ──
const bands = Array.from({length: 6}, (_, i) => ({
  offset: i * 0.9,
  speed: 0.003 + i * 0.001,
  color: i % 2 === 0 ? [38, 52, 102] : [191, 150, 115],
  amp: 60 + i * 15,
  freq: 0.6 + i * 0.2,
  alpha: 0.04 + i * 0.01,
}));

// ── Liquid ring ──
const RING_N = 200;
let ringPhase = 0;

// ── Star field ──
const stars = Array.from({length: 80}, () => ({
  x: Math.random() * 2000 - 1000,
  y: Math.random() * 2000 - 1000,
  r: Math.random() * 1.2 + 0.3,
  alpha: 0.1 + Math.random() * 0.4,
  twinkle: Math.random() * Math.PI * 2,
  speed: 0.01 + Math.random() * 0.03,
}));

// ── Gold streaks ──
const streaks = Array.from({length: 12}, (_, i) => ({
  angle: (i / 12) * Math.PI * 2,
  len: 30 + Math.random() * 50,
  speed: 0.004 + Math.random() * 0.006,
  r: 170 + Math.random() * 40,
  alpha: 0.15 + Math.random() * 0.25,
  isRed: i % 3 === 0,
}));

// ── Floating orbs ──
const orbs = Array.from({length: 5}, (_, i) => ({
  angle: (i / 5) * Math.PI * 2,
  r: 100 + i * 18,
  speed: 0.006 + i * 0.002,
  size: 3 + i * 1.5,
  isRed: i % 2 !== 0,
}));

let t = 0;

function loop() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#080810';
  ctx.fillRect(0, 0, W, H);

  t += 0.01;
  ringPhase += 0.018;

  const rawMx = mx < 0 ? CX : mx;
  const rawMy = my < 0 ? CY : my;
  const mdx = (rawMx - CX) / W;
  const mdy = (rawMy - CY) / H;

  // ── Aurora ──
  bands.forEach(b => {
    b.offset += b.speed;
    ctx.beginPath();
    ctx.moveTo(0, CY);
    for (let x = 0; x <= W; x += 4) {
      const y = CY
        + Math.sin((x / W) * Math.PI * b.freq + b.offset + t) * b.amp
        + Math.sin((x / W) * Math.PI * b.freq * 2 + b.offset * 1.3) * b.amp * 0.4
        + mdy * 40;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    const [r, g, bl] = b.color;
    ctx.fillStyle = `rgba(${r},${g},${bl},${b.alpha})`;
    ctx.fill();
  });

  // ── Deep center glow ──
  const cg = ctx.createRadialGradient(CX + mdx * 20, CY + mdy * 20, 0, CX, CY, 320);
  cg.addColorStop(0, 'rgba(38,52,102,0.35)');
  cg.addColorStop(0.4, 'rgba(191,150,115,0.06)');
  cg.addColorStop(1, 'rgba(8,8,16,0)');
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, W, H);

  // ── Stars ──
  stars.forEach(s => {
    s.twinkle += s.speed;
    const a = s.alpha * (0.5 + Math.sin(s.twinkle) * 0.5);
    ctx.beginPath();
    ctx.arc(CX + s.x + mdx * 8, CY + s.y + mdy * 8, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
    ctx.fill();
  });

  // ── Liquid morphing ring ──
  ctx.save();
  ctx.translate(CX + mdx * 12, CY + mdy * 12);

  // Outer soft halo
  const halo = ctx.createRadialGradient(0, 0, 85, 0, 0, 140);
  halo.addColorStop(0, 'rgba(191,150,115,0)');
  halo.addColorStop(0.5, 'rgba(191,150,115,0.08)');
  halo.addColorStop(1, 'rgba(8,8,16,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(0, 0, 140, 0, Math.PI * 2);
  ctx.fill();

  // Outer liquid ring
  ctx.beginPath();
  for (let i = 0; i <= RING_N; i++) {
    const a = (i / RING_N) * Math.PI * 2;
    const wave = Math.sin(a * 4 + ringPhase) * 10
               + Math.sin(a * 7 - ringPhase * 1.3) * 5
               + Math.sin(a * 2 + t) * 7;
    const rr = 100 + wave;
    const x = Math.cos(a) * rr;
    const y = Math.sin(a) * rr;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  const ringGrad = ctx.createLinearGradient(-100, -100, 100, 100);
  ringGrad.addColorStop(0,   'rgba(191,150,115,1)');
  ringGrad.addColorStop(0.3, 'rgba(199,33,44,0.9)');
  ringGrad.addColorStop(0.6, 'rgba(191,150,115,0.7)');
  ringGrad.addColorStop(1,   'rgba(38,52,102,0.5)');
  ctx.strokeStyle = ringGrad;
  ctx.lineWidth = 1.8;
  ctx.shadowColor = 'rgba(191,150,115,0.8)';
  ctx.shadowBlur = 22;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Inner ring
  ctx.beginPath();
  for (let i = 0; i <= RING_N; i++) {
    const a = (i / RING_N) * Math.PI * 2;
    const wave = Math.sin(a * 5 - ringPhase * 1.1) * 6
               + Math.sin(a * 3 + ringPhase * 0.7) * 4;
    const rr = 72 + wave;
    const x = Math.cos(a) * rr;
    const y = Math.sin(a) * rr;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(199,33,44,0.35)';
  ctx.lineWidth = 1;
  ctx.shadowBlur = 0;
  ctx.stroke();

  ctx.restore();

  // ── Gold streaks ──
  streaks.forEach(s => {
    s.angle += s.speed;
    const x1 = CX + Math.cos(s.angle) * s.r + mdx * 10;
    const y1 = CY + Math.sin(s.angle) * s.r + mdy * 10;
    const x2 = CX + Math.cos(s.angle + 0.15) * (s.r + s.len) + mdx * 10;
    const y2 = CY + Math.sin(s.angle + 0.15) * (s.r + s.len) + mdy * 10;
    const lg = ctx.createLinearGradient(x1, y1, x2, y2);
    const col = s.isRed ? 'rgba(199,33,44,' : 'rgba(191,150,115,';
    lg.addColorStop(0,   col + '0)');
    lg.addColorStop(0.5, col + s.alpha.toFixed(2) + ')');
    lg.addColorStop(1,   col + '0)');
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = lg;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  });

  // ── Orbs ──
  orbs.forEach(o => {
    o.angle += o.speed;
    const ox = CX + Math.cos(o.angle) * o.r + mdx * 6;
    const oy = CY + Math.sin(o.angle) * o.r + mdy * 6;
    const pulse = 1 + Math.sin(t * 2 + o.angle) * 0.3;
    const col = o.isRed ? 'rgba(199,33,44,' : 'rgba(191,150,115,';
    ctx.beginPath();
    ctx.arc(ox, oy, o.size * pulse, 0, Math.PI * 2);
    ctx.fillStyle = col + '0.8)';
    ctx.shadowColor = col + '1)';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // ── Center pulse ──
  const cp = 1 + Math.sin(t * 2.5) * 0.25;
  const cx2 = CX + mdx * 5;
  const cy2 = CY + mdy * 5;
  const cgrad = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, 18 * cp);
  cgrad.addColorStop(0,   'rgba(255,255,255,0.9)');
  cgrad.addColorStop(0.4, 'rgba(191,150,115,0.7)');
  cgrad.addColorStop(1,   'rgba(199,33,44,0)');
  ctx.beginPath();
  ctx.arc(cx2, cy2, 18 * cp, 0, Math.PI * 2);
  ctx.fillStyle = cgrad;
  ctx.shadowColor = 'rgba(191,150,115,1)';
  ctx.shadowBlur = 30;
  ctx.fill();
  ctx.shadowBlur = 0;

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
