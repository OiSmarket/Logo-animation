<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Premium Loader Alternative</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05050f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    canvas { position: fixed; inset: 0; }
    #ui {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    #logo-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #logo-img {
      width: clamp(65px, 15vw, 80px);
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(191,150,115,0.9));
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%,100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(191,150,115,0.7)); }
      50%      { transform: scale(1.06); filter: drop-shadow(0 0 25px rgba(199,33,44,0.6)); }
    }
    #brand {
      margin-top: 25px;
      text-align: center;
    }
    #brand-name {
      font-size: clamp(14px, 4vw, 18px);
      font-weight: 700;
      letter-spacing: 12px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #BF9673, #fff, #BF9673);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    #progress-wrap {
      margin-top: 25px;
      width: clamp(100px, 25vw, 160px);
      height: 1px;
      background: rgba(255,255,255,0.05);
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #BF9673, #C7212C);
      animation: progressAnim 3.5s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(191,150,115,0.6);
    }
    @keyframes progressAnim {
      0%   { width: 0%;   opacity: 0.8; }
      70%  { width: 100%; opacity: 0.8; }
      85%  { width: 100%; opacity: 0; }
      100% { width: 0%;   opacity: 0; }
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="logo-wrap">
    <img id="logo-img" src="logo.png" alt="logo" />
  </div>
  <div id="brand">
    <div id="brand-name">LOADING</div>
  </div>
  <div id="progress-wrap">
    <div id="progress-bar"></div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, CX, CY, scale;
  let t = 0;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CX = W/2; CY = H/2;
    scale = Math.max(0.45, Math.min(1.0, W / 800));
  }
  resize();
  window.addEventListener('resize', resize);

  // DNA Helix
  const DNA_COUNT = 30;
  const dnaPoints = Array.from({length: DNA_COUNT}, (_, i) => ({
    phase: (i / DNA_COUNT) * Math.PI * 4,
    speed: 0.01 + Math.random() * 0.005,
    size: 2 + Math.random() * 2,
    strand: i % 2, 
    trail: []
  }));

  // Ripples
  const ripples = [];
  let rippleTimer = 0;

  // Background particles
  const particles = Array.from({length: 50}, (_, i) => ({
    x: (Math.random()-0.5)*W*1.5,
    y: (Math.random()-0.5)*H*1.5,
    vx: (Math.random()-0.5)*0.2,
    vy: (Math.random()-0.5)*0.2,
    r: 0.5 + Math.random(),
    alpha: 0.1 + Math.random()*0.3,
    col: i%2===0?'191,150,115':'199,33,44'
  }));

  function loop() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#05050f';
    ctx.fillRect(0,0,W,H);

    t += 0.012;

    // Center Atmosphere
    const glow = ctx.createRadialGradient(CX,CY,0,CX,CY,250*scale);
    glow.addColorStop(0, 'rgba(38,52,102,0.3)');
    glow.addColorStop(1, 'rgba(5,5,15,0)');
    ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

    // BG Stars
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if(Math.abs(p.x) > W) p.x *= -0.8;
      if(Math.abs(p.y) > H) p.y *= -0.8;
      ctx.beginPath();
      ctx.arc(CX+p.x, CY+p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.col}, ${p.alpha})`;
      ctx.fill();
    });

    ctx.save(); ctx.translate(CX, CY);

    // Moving Rings (Liquid Metal)
    for(let rIdx=0; rIdx<2; rIdx++) {
      const dir = rIdx===0 ? 1 : -1;
      const baseR = (rIdx===0 ? 110 : 85) * scale;
      ctx.beginPath();
      for(let i=0; i<=180; i++) {
        const a = (i/180)*Math.PI*2;
        const wave = Math.sin(a*5 + t*3*dir)*6*scale + Math.sin(a*3 - t*dir)*4*scale;
        const rr = baseR + wave;
        const x = Math.cos(a)*rr, y = Math.sin(a)*rr;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle = rIdx===0 ? 'rgba(191,150,115,0.7)' : 'rgba(199,33,44,0.4)';
      ctx.lineWidth = 1.5;
      if(rIdx===0) { ctx.shadowColor = 'rgba(191,150,115,0.8)'; ctx.shadowBlur = 15; }
      ctx.stroke(); ctx.shadowBlur = 0;
    }

    // DNA Helix Points
    const hR = 90*scale, hH = 45*scale;
    dnaPoints.forEach(p => {
      p.phase += p.speed;
      const x = Math.cos(p.phase)*hR, y = Math.sin(p.phase*0.6)*hH, z = Math.sin(p.phase);
      const alpha = 0.3 + z*0.7, sz = p.size * (0.7 + z*0.5) * scale;
      const col = p.strand === 0 ? '191,150,115' : '199,33,44';

      ctx.beginPath();
      ctx.arc(x,y,sz,0,Math.PI*2);
      ctx.fillStyle = `rgba(${col}, ${alpha})`;
      if(z > 0) { ctx.shadowColor = `rgba(${col}, 1)`; ctx.shadowBlur = 10; }
      ctx.fill(); ctx.shadowBlur = 0;
    });

    ctx.restore();

    // Subtle Ripple
    rippleTimer++;
    if(rippleTimer > 110) { 
      ripples.push({r: 0, a: 0.5}); 
      rippleTimer=0; 
    }
    ripples.forEach((r, i) => {
      r.r += 1.5; r.a -= 0.005;
      if(r.a <= 0) ripples.splice(i,1);
      ctx.beginPath(); ctx.arc(CX,CY,r.r,0,Math.PI*2);
      ctx.strokeStyle = `rgba(191,150,115,${r.a})`;
      ctx.stroke();
    });

    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
